# Local development stack: PostgreSQL + API + web. See docs/DEVELOPMENT.md.
#   cp .env.example .env            # set POSTGRES_PASSWORD and SEED_PASSWORD
#   docker compose up --build --wait
#   docker compose exec api python -m scripts.seed
#   docker compose exec api python -m scripts.import_content --author-unlinked   # or --author-email EMAIL
#
# Not for production: it publishes the API and database on localhost and has no
# reverse proxy. Production uses deploy/docker-compose.prod.yml (docs/DEPLOYMENT.md).
name: kyrgyzstem

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kyrgyzstem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kyrgyzstem}
    # Host port is configurable in case 5432 is taken by a local PostgreSQL.
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    build: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kyrgyzstem}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kyrgyzstem}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      CONTENT_DIR: /content
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Trust X-Forwarded-For only from the web container (fixed address below), never "*".
      # Without a reverse proxy in front of web the header is still client-controlled
      # (audit F-01); deploy/docker-compose.prod.yml adds the proxy that overwrites it.
      FORWARDED_ALLOW_IPS: 172.29.57.10
      # Optional AI assistant: empty means off, and the platform still works.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes: ["./content:/content:ro"]  # problems + curriculum for scripts.import_content
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    # Exposed on localhost only, for /api/v1/docs during development.
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s  # migrations run before uvicorn starts
      retries: 5
    logging: *logging

  web:
    build:
      context: ./apps/web
      args: { API_INTERNAL_URL: http://api:8000 }
    depends_on:
      api: { condition: service_healthy }
    networks:
      backend: { ipv4_address: 172.29.57.10 }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging: *logging

  # Phase 3 (not built): Judge0 will run under its own profile on a separate `internal`
  # network that the database is not on and that has no internet access. The API reaches
  # it only through JudgeClient. Until then JUDGE0_URL stays empty and submissions are
  # stored as not_judged. See docs/DEPLOYMENT.md#judge-isolation.

networks:
  backend:
    ipam:
      config: [{ subnet: 172.29.57.0/24 }]

volumes:
  pgdata:
