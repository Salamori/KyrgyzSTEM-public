# Weekly dependency update pull requests. Review them like any other PR
# (docs/DEPENDENCIES.md): read the changelog, let CI run, never auto-merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: { interval: monthly }
