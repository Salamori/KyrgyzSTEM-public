name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: kyrgyzstem_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      # Throwaway credentials of the CI service container, not a secret.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kyrgyzstem_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12", enable-cache: true }
      - name: Install g++ (C++ reference solutions in tests/test_content.py)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app scripts tests
      - run: uv run pytest -rfEsx

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contract:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12", enable-cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Re-export OpenAPI from the FastAPI app (no database needed)
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run python -m scripts.export_openapi
      - name: Regenerate TypeScript types
        working-directory: apps/web
        run: |
          npm ci
          npm run gen:api
      - name: Fail if the committed contract is stale
        run: |
          git diff --exit-code -- apps/web/src/lib/api/openapi.json apps/web/src/lib/api/schema.d.ts \
            || { echo "::error::Run 'uv run python -m scripts.export_openapi' (apps/api) and 'npm run gen:api' (apps/web), then commit."; exit 1; }

  e2e:
    name: E2E (docker compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the development stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=cionly/' .env
          sed -i 's/^SEED_PASSWORD=.*/SEED_PASSWORD=ci-only-seed-password/' .env
          docker compose up --build --detach --wait --wait-timeout 300
          docker compose exec -T api python -m scripts.seed
          docker compose exec -T api python -m scripts.import_content --author-unlinked
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - working-directory: apps/web
        env:
          E2E_ADMIN_PASSWORD: ci-only-seed-password
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        run: docker compose logs --no-color

  proxy-smoke:
    name: Production topology smoke test (audit F-01)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web]
    env:
      ENV_FILE: deploy/.env.production
    steps:
      - uses: actions/checkout@v4
      - name: Start the production stack over plain HTTP
        run: |
          cp .env.example "$ENV_FILE"
          sed -i -e 's/^APP_ENV=.*/APP_ENV=production/' \
                 -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=cionly/' \
                 -e 's|^SITE_ADDRESS=.*|SITE_ADDRESS=http://localhost|' \
                 -e 's/^RELEASE_TAG=.*/RELEASE_TAG=ci/' "$ENV_FILE"
          docker compose -f deploy/docker-compose.prod.yml --env-file "$ENV_FILE" up --build --detach --wait --wait-timeout 300
      - run: bash deploy/smoke-test.sh http://localhost
      - if: failure()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file "$ENV_FILE" logs --no-color
