name: Dependency audit

# Known-vulnerability scan of the locked dependencies (docs/DEPENDENCIES.md).
# Weekly, on demand, and whenever a lockfile changes.
on:
  schedule: [{ cron: "17 4 * * 1" }]
  workflow_dispatch:
  pull_request:
    paths: [apps/api/uv.lock, apps/web/package-lock.json]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12" }
      - name: pip-audit on the exact locked versions (runtime and dev)
        run: |
          uv export --locked --format requirements-txt --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high
